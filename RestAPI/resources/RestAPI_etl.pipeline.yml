# The main pipeline for RestAPI

resources:
  pipelines:
    RestAPI_etl:
      name: RestAPI_etl
      configuration:
        catalog_name: ${var.catalog}
      libraries:
        - glob:
            include:../src/RestAPI/pipeline/RestAPIIngesttoSilver/transformations/**
      schema: sliver
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      root_path: ../src/RestAPI/pipeline/RestAPIIngesttoSilver
