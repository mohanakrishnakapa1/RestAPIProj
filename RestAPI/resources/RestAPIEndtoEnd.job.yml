resources:
  jobs:
    RestAPIPorjBronzeLoad:
      name: RestAPIPorjBronzeLoad
      tasks:
        - task_key: Ingestion_to_Bronze
          notebook_task:
            notebook_path: ../src/RestAPI/notebooks/Ingestion_Bronze
            base_parameters:
              catalog_name: ${var.catalog}
              schema_name: ${var.schema}
            source: WORKSPACE
          environment_key: Default
        - task_key: BronzeToSliver
          depends_on:
            - task_key: Ingestion_to_Bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.RestAPI_etl.id}
            full_refresh: false
        - task_key: EarquakeDashboard
          depends_on:
            - task_key: BronzeToSliver
          dashboard_task:
            subscription:
              subscribers:
                - user_name: mohankapa@outlook.com
            warehouse_id: ef1eec6de63bf039
            dashboard_id: 01f1112336881f7c9b57ffad1ddc7f63
      git_source:
        git_url: https://github.com/mohanakrishnakapa1/RestAPIProj.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
        - name: schema_name
          default: ${var.schema}
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
