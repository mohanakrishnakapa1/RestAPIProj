# This is a Databricks asset bundle definition for RestAPI.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: RestAPI
  uuid: 71e4b81f-0049-4b82-a4b7-ce60bcc6227f

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: WarehouseID

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: restapiproj
      schema: bronze
      warehouse_id: ef1eec6de63bf039
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/mohankapa@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mohankapa@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: silver
      warehouse_id: ef1eec6de63bf039
    permissions:
      - user_name: mohankapa@outlook.com
        level: CAN_MANAGE
